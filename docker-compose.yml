services:
  # ── Discord Music Bot ───────────────────────────────────────
  bot:
    build: .
    container_name: music-bot
    restart: unless-stopped
    env_file: .env
    ports:
      - "${DEBUG_PORT:-9090}:${DEBUG_PORT:-9090}"
    volumes:
      # Mount cookies.txt from host for YouTube auth (yt-dlp needs write access to update cookies)
      - ./cookies.txt:/app/cookies.txt
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const p=process.env.DEBUG_PORT||'9090';
          const t=encodeURIComponent(process.env.DEBUG_TOKEN||'');
          fetch('http://127.0.0.1:'+p+'/api/status?token='+t)
            .then(r=>process.exit(r.ok?0:1))
            .catch(()=>process.exit(1));
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── Web dashboard / landing page (Next.js) ──────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: music-bot-dashboard
    restart: unless-stopped
    env_file: ./dashboard/.env
    ports:
      # Bound to loopback: public traffic arrives through cloudflared on the host
      - "127.0.0.1:4123:4123"
