services:
  # ── Discord Music Bot ───────────────────────────────────────
  bot:
    build: .
    container_name: music-bot
    restart: unless-stopped
    env_file: .env
    # Use host networking to avoid Docker NAT issues with Discord voice UDP
    network_mode: host
    volumes:
      # Mount cookies.txt from host for YouTube auth (yt-dlp needs write access to update cookies)
      - ./cookies.txt:/app/cookies.txt
